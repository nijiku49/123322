<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>flowers</title>
<link rel="stylesheet" href="/style.css">
<script src="/nav.js"></script>
</head>
<body>

<header id="siteBrand"></header>

<div class="layout">
<nav id="siteNav"></nav>
<main>

<p>
  Поиск: <input type="text" id="searchQuery" placeholder="Название букета" oninput="applyFilters()">
  Сортировка:
  <select id="sortOrder" onchange="applyFilters()">
    <option value="none">По умолчанию</option>
    <option value="price_asc">Сначала дешевле</option>
    <option value="price_desc">Сначала дороже</option>
  </select>
</p>

<h2>Фильтры</h2>
<p>
  Цена от <input type="number" id="filterMinPrice" size="6" value="0">
  до <input type="number" id="filterMaxPrice" size="6" placeholder="без ограничений">
</p>
<p>
  Состав (можно выбрать несколько — покажутся букеты, где есть ХОТЯ БЫ один из отмеченных цветов):
  <br>
  <span id="filterFlowers">Загрузка...</span>
</p>
<p>
  <button onclick="applyFilters()">Применить фильтры</button>
  <button onclick="resetFilters()">Сбросить</button>
</p>

<hr>

<div id="bouquetList">Загрузка...</div>

</main>
</div>

<script>
let allBouquets = [];
let allFlowers = [];
let favoriteIds = new Set();

async function loadFlowersForFilter() {
  const res = await fetch('/api/flowers');
  allFlowers = await res.json();

  const container = document.getElementById('filterFlowers');
  container.innerHTML = '';

  allFlowers.forEach(flower => {
    const label = document.createElement('label');
    label.style.marginRight = '10px';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = flower.id;
    checkbox.className = 'flowerFilterCheckbox';

    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(' ' + flower.name));
    container.appendChild(label);
  });
}

async function loadBouquets() {
  const res = await fetch('/api/bouquets');
  allBouquets = await res.json();

  const userToken = localStorage.getItem('flowershop_user_token');
  if (userToken) {
    const favRes = await fetch('/api/favorites', { headers: { 'X-User-Token': userToken } });
    if (favRes.ok) {
      const favs = await favRes.json();
      favoriteIds = new Set(favs.map(b => b.id));
    }
  }

  applyFilters();
}

function renderBouquets(list) {
  const isAdmin = !!localStorage.getItem('flowershop_admin_token');
  const userToken = localStorage.getItem('flowershop_user_token');
  const container = document.getElementById('bouquetList');
  container.innerHTML = '';

  if (list.length === 0) {
    container.textContent = 'Ничего не найдено по заданным фильтрам.';
    return;
  }

  list.forEach(bouquet => {
    const div = document.createElement('div');
    div.className = 'card';

    const componentsText = bouquet.components
      .map(c => `${c.name} × ${c.quantity} (${c.price}₽/шт, в наличии ${c.stock})`)
      .join(', ');

    div.innerHTML = `
      <h3>${bouquet.name}</h3>
      <p>${bouquet.description}</p>
      <p>Состоит из: ${componentsText}</p>
      <p>Цена: ${bouquet.price.toFixed(2)}₽</p>
      <p>В наличии: ${bouquet.availability}</p>
    `;

    if (!isAdmin) {
      const addBtn = document.createElement('button');
      addBtn.textContent = bouquet.availability > 0 ? 'В корзину' : 'Нет в наличии';
      addBtn.disabled = bouquet.availability <= 0;
      addBtn.onclick = () => addToCart(bouquet.id, addBtn);
      div.appendChild(addBtn);

      if (userToken) {
        const favBtn = document.createElement('button');
        favBtn.textContent = favoriteIds.has(bouquet.id) ? '★ В избранном' : '☆ В избранное';
        favBtn.onclick = () => toggleFavorite(bouquet.id, favBtn);
        div.appendChild(favBtn);
      }
    }

    container.appendChild(div);
  });
}

function applyFilters() {
  const minPrice = parseFloat(document.getElementById('filterMinPrice').value) || 0;
  const maxPriceRaw = document.getElementById('filterMaxPrice').value;
  const maxPrice = maxPriceRaw === '' ? Infinity : parseFloat(maxPriceRaw);
  const searchQuery = document.getElementById('searchQuery').value.trim().toLowerCase();
  const sortOrder = document.getElementById('sortOrder').value;

  const checkedFlowerIds = Array.from(document.querySelectorAll('.flowerFilterCheckbox:checked'))
    .map(cb => parseInt(cb.value));

  let filtered = allBouquets.filter(bouquet => {
    const priceOk = bouquet.price >= minPrice && bouquet.price <= maxPrice;

    const compositionOk = checkedFlowerIds.length === 0 ||
      bouquet.components.some(c => checkedFlowerIds.includes(c.flower_id));

    const searchOk = searchQuery === '' || bouquet.name.toLowerCase().includes(searchQuery);

    return priceOk && compositionOk && searchOk;
  });

  if (sortOrder === 'price_asc') {
    filtered = filtered.slice().sort((a, b) => a.price - b.price);
  } else if (sortOrder === 'price_desc') {
    filtered = filtered.slice().sort((a, b) => b.price - a.price);
  }

  renderBouquets(filtered);
}

async function toggleFavorite(bouquetId, btn) {
  const userToken = localStorage.getItem('flowershop_user_token');
  const isFav = favoriteIds.has(bouquetId);

  const res = await fetch('/api/favorites' + (isFav ? '/' + bouquetId : ''), {
    method: isFav ? 'DELETE' : 'POST',
    headers: { 'X-User-Token': userToken },
    body: isFav ? undefined : JSON.stringify({ bouquet_id: bouquetId })
  });

  if (res.ok) {
    if (isFav) {
      favoriteIds.delete(bouquetId);
      btn.textContent = '☆ В избранное';
    } else {
      favoriteIds.add(bouquetId);
      btn.textContent = '★ В избранном';
    }
  }
}

function resetFilters() {
  document.getElementById('filterMinPrice').value = 0;
  document.getElementById('filterMaxPrice').value = '';
  document.getElementById('searchQuery').value = '';
  document.getElementById('sortOrder').value = 'none';
  document.querySelectorAll('.flowerFilterCheckbox').forEach(cb => cb.checked = false);
  applyFilters();
}

async function addToCart(bouquetId, btn) {
  const userToken = localStorage.getItem('flowershop_user_token');
  if (!userToken) {
    window.location.href = '/login';
    return;
  }

  const res = await fetch('/api/cart', {
    method: 'POST',
    headers: { 'X-User-Token': userToken },
    body: JSON.stringify({ bouquet_id: bouquetId, quantity: 1 })
  });
  const data = await res.json();

  if (res.ok) {
    const original = btn.textContent;
    btn.textContent = 'Добавлено ✓';
    setTimeout(() => { btn.textContent = original; }, 1000);
  } else {
    alert(data.error || 'Не удалось добавить в корзину');
  }
}

renderSiteHeader();
loadFlowersForFilter();
loadBouquets();
</script>

</body>
</html>
